# Entorno de la Raspberry: controla el brazo y transmite la cámara. Incluye MediaPipe para poder
# correr también la app del operador en la propia Raspberry. Requiere Raspberry Pi OS de 64 bits.
#   conda env create -f environment-raspberry.yml
#   conda activate brazo-pi
name: brazo-pi
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pyserial
  - portaudio        # MediaPipe importa sounddevice, que la necesita
  - pip:
      - opencv-contrib-python==4.14.0.94
      - mediapipe==1.1.1
