# Entorno de la computadora del operador cuando es otra máquina (también sirve para desarrollar y
# correr las pruebas).
# La Raspberry usa environment-raspberry.yml.
#   conda env create -f environment.yml
#   conda activate brazo
#
# OpenCV y MediaPipe van por pip: MediaPipe depende del paquete pip de OpenCV y
# mezclarlo con el de conda-forge deja dos módulos cv2 en conflicto.
name: brazo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy<2          # MediaPipe 0.10.18 no admite NumPy 2
  - pyserial
  - portaudio        # MediaPipe importa sounddevice, que la necesita
  - pytest
  - pip:
      - opencv-contrib-python==4.11.0.86   # la última que acepta NumPy 1
      # 0.10.18 y no 1.x: MediaPipe 1.x exige instrucciones AES y no arranca en una Raspberry Pi 4
      - mediapipe==0.10.18
