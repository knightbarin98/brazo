# Entorno único del proyecto: el mismo en la Raspberry, en la computadora del operador y para
# desarrollar. No hace falta crearlo ni activarlo a mano: 'python main.py' lo crea, lo actualiza
# cuando este archivo cambia y se ejecuta dentro de él.
# Se llama brazo-gemelo para no confundirlo con los entornos de antes (brazo y brazo-pi).
#
# OpenCV y MediaPipe van por pip: MediaPipe depende del paquete pip de OpenCV y
# mezclarlo con el de conda-forge deja dos módulos cv2 en conflicto.
name: brazo-gemelo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy<2          # MediaPipe 0.10.18 no admite NumPy 2
  - pyserial
  - portaudio        # MediaPipe importa sounddevice, que la necesita
  - pytest
  - pip:
      - opencv-contrib-python==4.11.0.86   # la última que acepta NumPy 1
      # 0.10.18 y no 1.x: MediaPipe 1.x exige instrucciones AES y no arranca en una Raspberry Pi 4
      - mediapipe==0.10.18
